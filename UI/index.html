<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Line</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #cv { position: fixed; inset: 0; display: block; }
  #hint {
    position: fixed; left: 14px; bottom: 12px; z-index: 2;
    color: #333; font: 12px/1.6 Consolas, monospace; user-select: none;
    transition: opacity 1s ease; white-space: pre;
  }
  #ask {
    position: fixed; left: 50%; bottom: 9%; transform: translateX(-50%);
    width: min(560px, 80vw); z-index: 3;
    background: transparent; border: none; outline: none;
    border-bottom: 1px solid rgba(255,255,255,0.3);
    color: #eee; font: 17px/1.5 Consolas, monospace; text-align: center;
    padding: 6px 4px; caret-color: #9fdcff;
    /* always there, gently dimmed: just start typing and it wakes up */
    opacity: 0.55; transition: opacity 0.35s ease;
  }
  #ask.open, #ask.edit, #ask:focus {
    border-bottom-color: rgba(255,255,255,0.45);
  }
  #ask.hidden { opacity: 0; pointer-events: none; }
  /* settings open: input steps down out of the panel's way */
  #ask.tuck { bottom: 8px; font-size: 14px; }
  /* editing a settings field: input takes center stage, panel dims behind */
  #ask.edit { bottom: 48%; font-size: 19px; opacity: 1; }
  #ask::placeholder { color: rgba(255,255,255,0.55); }
  /* little screens: smaller type, and the input rides above the icon row
     so it never swallows taps meant for the gear / list / mic */
  @media (max-width: 640px) {
    #ask { font-size: 14px; width: 88vw; bottom: 13%; }
    #ask.tuck { bottom: 8px; width: 50vw; }
    #ask.edit { font-size: 16px; bottom: 48%; }
    #hint { font-size: 10px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hint">1 idle   2 thinking   3 speaking (test voice)</div>
<input id="ask" placeholder="ask anything" autocomplete="off" spellcheck="false">
<script type="importmap">
  { "imports": { "three": "./lib/three.module.js" } }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
